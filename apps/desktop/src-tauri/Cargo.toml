[package]
name = "tiktok-media-creator"
version = "0.2.0"
description = "A Windows-first editor for short-form video"
authors = ["TikTok Media Creator"]
edition = "2021"

[lib]
name = "tiktok_media_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
yt-dlp = { version = "2.10", features = ["rustls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
